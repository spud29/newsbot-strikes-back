name: Auto-improve codebase

# Runs weekly (Mondays 2 AM UTC) or on manual trigger.
# Uses Claude API to analyse the codebase, propose improvements, and open a PR.
# Never commits to main — always targets a claude/auto-* branch.
#
# Required secret: ANTHROPIC_API_KEY
# GITHUB_TOKEN is auto-provided by GitHub Actions.

on:
  schedule:
    - cron: '0 2 * * 1'   # Monday 02:00 UTC
  workflow_dispatch:        # manual trigger from the Actions tab

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write        # push the auto branch
      pull-requests: write   # open the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so git log context is available

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run cloud improvement agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python evals/cloud_improve.py
